name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only the dev tooling + pure-python deps we actually need
          # for linting and the offline test suite. Heavy third-party libs
          # (chromadb, sentence-transformers, etc.) are stubbed in
          # tests/conftest.py so CI runs fast and deterministic.
          pip install ruff pytest pytest-asyncio python-dotenv requests

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Pytest
        env:
          GROQ_API_KEY: test-key-not-used
          LANGSMITH_TRACING: "false"
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q
